# Spike S3: a card from a workflow_run job (runs with the default branch's file and full rights after another run).
name: Claims on workflow_run
on:
  workflow_run:
    workflows: [Claims printer]
    types: [completed]
permissions: {}
jobs:
  card:
    if: contains(fromJSON('["push","pull_request"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            tools
      - uses: ./.github/actions/print-card
